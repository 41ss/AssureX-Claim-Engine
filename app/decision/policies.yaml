# Warranty policies and thresholds (xxvi). Owner: Keagan.
# Keep every rule the judges might ask you to change in this file.

thresholds:
  min_confidence: 0.60        # below this -> Manual Review Required
  max_confidence_gap: 0.20    # models disagree by more than this -> Manual Review Required

categories:
  default:
    warranty_months: 12
    covered_faults: []
    excluded_damage: [physical, water]
    required_documents: [receipt, product_image]
