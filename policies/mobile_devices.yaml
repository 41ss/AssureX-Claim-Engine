# Warranty policy: phones, tablets and wearables. Owner: Keagan.
# Every field below is required by SRS 1.10.7.
product_category: mobile_devices
examples: [smartphone, tablet, smartwatch, earbuds]

coverage_duration_months: 12
warranty_start: purchase_date
grace_period_days: 0
claim_reporting_period_days: 14

covered_faults: [battery, charging_port, display, camera, speaker_or_microphone, manufacturing_defect]
exclusions: [physical_damage, water_damage, cracked_screen, software_issue, lost_or_stolen, cosmetic_wear]

repair_conditions:
  max_covered_repairs: 2
  unauthorized_repair_voids_warranty: true
authorized_service_centre_required: true
replacement_conditions:
  replace_after_failed_repairs: 2
  replacement_restarts_warranty: false
  max_replacements: 1

mandatory_documents: [receipt, serial_photo, product_image, fault_evidence]
optional_documents: [warranty_card, fault_video, repair_report]

hard_fail_rules:
  - warranty_expired_beyond_grace
  - excluded_damage
  - unauthorized_repair
  - max_replacements_exceeded
warning_rules:
  - reported_after_reporting_period
  - previous_repairs_present
manual_review_rules:
  - serial_number_mismatch
  - missing_mandatory_document
  - contradiction_detected
  - duplicate_claim_or_document
  - fault_not_in_covered_list
